[project]
name = "nomnom"
version = "0.1.0"
description = "Plugin-based CLI file watcher"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9",
    "watchfiles>=0.21",
    "tomli-w>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
nomnom = "nomnom.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # typer.Option() in function signatures is idiomatic Typer usage

[tool.mypy]
python_version = "3.11"
strict = true

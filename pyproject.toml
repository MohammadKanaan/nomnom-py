[project]
name = "nomnom-py"
version = "1.1.0"
license = { text = "MIT" }
license-files = ["LICENSE.md"]
description = "Plugin-based CLI file watcher"
requires-python = ">=3.11"
readme = "README.md"
authors = [{ name = "Mohammad Kanaan", email = "mohammadkanaan.me@gmail.com" }]
keywords = ["cli", "file-watcher", "plugins"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
]
dependencies = [
    "rich>=13.0",
    "typer>=0.9",
    "watchfiles>=0.21",
    "tomli-w>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/MohammadKanaan/nomnom-py"
Repository = "https://github.com/MohammadKanaan/nomnom-py"
Issues = "https://github.com/MohammadKanaan/nomnom-py/issues"

[project.scripts]
nomnom = "nomnom.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
    "/.conductor",
    "/.jj",
    "/.jules",
    "/.mypy_cache",
    "/.pytest_cache",
    "/.ruff_cache",
    "/.uv-cache",
    "/.venv",
    "/config.toml",
    "/dist",
]

[tool.hatch.build.targets.wheel]
packages = ["nomnom"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # typer.Option() in function signatures is idiomatic Typer usage

[tool.mypy]
python_version = "3.11"
strict = true

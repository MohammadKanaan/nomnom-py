[project]
name = "nomnom"
version = "0.1.0"
description = "Plugin-based CLI file watcher"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9",
    "watchfiles>=0.21",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
nomnom = "nomnom.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
